<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AboveFL360 | PSR & PET Practice Test</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <img src="assets/logo.png" alt="AboveFL360 logo">
  <div class="brand">ABOVE<span>FL</span>360</div>
</header>

<main>
  <div class="card">

    <!-- Start screen -->
    <section id="start-screen">
      <img class="start-logo" src="assets/logo.png" alt="AboveFL360">
      <h1 class="start-title">PSR & PET Practice Test</h1>
      <p class="start-sub">27 questions. No timer. Pick the best answer for each and submit at the end.</p>

      <div class="field">
        <label for="name-input">Full name</label>
        <input type="text" id="name-input" placeholder="Your name" autocomplete="name">
      </div>
      <div class="field">
        <label for="email-input">Email</label>
        <input type="email" id="email-input" placeholder="you@example.com" autocomplete="email">
      </div>
      <p class="error-text" id="start-error">Please enter your name and email to continue.</p>

      <button class="btn" id="start-btn">Start test</button>
    </section>

    <!-- Quiz screen -->
    <section id="quiz-screen" class="hidden">
      <div class="progress-row">
        <div class="progress-label" id="progress-label">Question 1 of 27</div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>

      <p class="question-text" id="question-text"></p>
      <div class="options" id="options-list"></div>

      <div class="nav-row">
        <button class="btn btn-secondary" id="prev-btn">Back</button>
        <button class="btn" id="next-btn">Next</button>
      </div>
    </section>

    <!-- Done screen -->
    <section id="done-screen" class="hidden">
      <div class="done-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h1 class="done-title">Responses submitted</h1>
      <p class="done-sub" id="done-sub">Thank you. Your answers have been recorded.</p>
    </section>

  </div>
</main>

<footer class="site-footer">
  ABOVE<span>FL</span>360
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="questions.js"></script>
<script src="script.js"></script>
</body>
</html>
